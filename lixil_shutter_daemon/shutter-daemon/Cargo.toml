[package]
name = "shutter-daemon"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shutter-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
uuid = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
axum = "0.7"
# rustls instead of the default native-tls backend -- avoids pulling in
# OpenSSL (and its headers) into the build stage just for a couple of
# Supervisor API calls over the addon's internal network.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# bluez-async pulls in libdbus-sys, which needs dbus-1 via pkg-config -- only
# ever available (and only ever used) on the Linux target this ships to, not
# the macOS dev machine `cargo check` runs on. btleplug has been dropped
# entirely (see ble/session.rs) -- this is now the daemon's only BLE dep, and
# the whole `ble` module only compiles for this target as a result.
[target.'cfg(target_os = "linux")'.dependencies]
bluez-async = "0.8"
